name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: ["claude/telegram-content-curator-app-YUNWL"]
  workflow_dispatch:   # позволяет запустить вручную из GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          # URL бэкенда — задаётся в Settings → Secrets → VITE_API_URL
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Базовый путь для GitHub Pages: /portfolio/
          VITE_BASE_PATH: /portfolio/
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
